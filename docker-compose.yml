# Notin — one-command local stack (WP-AUDIT).
# Dev/demo use: put real secrets in backend/.env (see backend/.env.example);
# the values below are throwaway local defaults only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notin
      POSTGRES_PASSWORD: notin
      POSTGRES_DB: notin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://notin:notin@db:5432/notin
      APP_ORIGIN: http://localhost:5000
      PUBLIC_APP_URL: http://localhost:5000
      TRUST_PROXY: "1"
      AUTH_EMAIL_ENABLED: "false"
      # Local demo conveniences — never copy these into a real deployment.
      ALLOW_DEMO_OTP: "true"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/db/migrate.js && node src/server.js"

volumes:
  pgdata:
