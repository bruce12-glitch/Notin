# Render Blueprint — one-click live demo deploy for Notin
# Usage:
#   1. Commit + push this repo to GitHub (main branch).
#   2. Go to https://dashboard.render.com -> New -> Blueprint -> select bruce12-glitch/Notin.
#   3. When prompted, set APP_ORIGIN and PUBLIC_APP_URL to the service URL
#      Render assigns (https://notin-XXXX.onrender.com) — both must be the
#      exact https:// URL, otherwise the production boot refuses to start.
#   4. Deploy. First boot runs migrations automatically (migrate.js is
#      idempotent). Health check: GET /health ; load-balancer readiness:
#      GET /api/health.
#
# Notes:
#   - JWT/OTP secrets are auto-generated per deploy. AUTH_EMAIL_ENABLED=false
#     means OTP login uses the API flow without SMTP (demo codes are disabled
#     in production; use password signup or wire SMTP_* vars to enable email).
#   - Free tier has no persistent disk: uploaded files are ephemeral across
#     deploys. For durable files set STORAGE_PROVIDER=s3 with S3_BUCKET +
#     AWS credentials, or upgrade to a paid instance with a disk mounted at
#     /app/backend/uploads.
#   - Free Postgres expires after its trial window; attach a paid Postgres
#     (or any external postgres:// URL via DATABASE_URL) for a permanent demo.

services:
  - type: web
    name: notin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: notin-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false