<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Shared note — Notin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f7f6f2;color:#222;font-family:Inter,system-ui,sans-serif} .shell{width:min(820px,calc(100% - 32px));margin:42px auto}.brand{display:flex;align-items:center;gap:9px;margin-bottom:30px;color:#176b2b;font-weight:800}.mark{display:grid;width:30px;height:30px;place-items:center;border-radius:8px;background:#00a82d;color:#fff}.note{border:1px solid #e1e0dc;border-radius:14px;background:#fff;padding:clamp(24px,5vw,52px);box-shadow:0 12px 38px rgba(25,35,25,.06)}h1{margin:0 0 24px;font-size:clamp(28px,5vw,46px);line-height:1.12;letter-spacing:-.035em}.body{font-size:16px;line-height:1.75;white-space:pre-wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:30px}.gallery img{display:block;width:100%;max-height:460px;object-fit:contain;border:1px solid #e2e2de;border-radius:10px;background:#fafafa}.state{padding:48px;text-align:center;color:#666}.error h1{font-size:26px}.meta{margin-top:30px;color:#777;font-size:12px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">N</span> Notin</div>
    <article class="note" id="sharedNote" hidden>
      <h1 id="sharedTitle"></h1>
      <div class="body" id="sharedBody"></div>
      <div class="gallery" id="sharedImages"></div>
      <div class="meta">Shared as read-only</div>
    </article>
    <div class="note state" id="shareState">Loading shared note…</div>
  </main>
  <script src="share.js"></script>
</body>
</html>
